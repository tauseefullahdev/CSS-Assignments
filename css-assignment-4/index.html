<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css-assignment-5</title>
    <link rel="stylesheet" href="style.css">
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=send" />


</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>SEND US A MESSAGE</h1>        
            <form action="">
            <label for="fullName">
                <input type="text" id="fullName" name="Name" placeholder="Full Name" required>
            </label><br>
        <label for="email">
            <input type="email" id="email" name="email" placeholder="E-mail" required>
        </label><br>
        <label for="phone">
            <input type="tel" id="phone" name="phone" placeholder="Phone" required>
        </label><br>
        <label for="userMessage">
        <textarea 
        id="userMessage" 
        name="message" 
        rows="5" 
        cols="30" 
        placeholder="Your Message"></textarea>
        </label>
        <button type="submit" class="button"><span class="material-symbols-outlined">
    send
</span>SEND</button>
        
    </form>
</div>
</div>
</body>
</html>
